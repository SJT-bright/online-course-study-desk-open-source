name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix local-asr
      - run: bash tools/build-macos-launcher.sh
        if: runner.os == 'macOS'
      - run: npm test
      - run: npm run smoke:desktop
        env:
          STUDYDESK_SMOKE_REPORT: desktop-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: desktop-smoke.json
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix local-asr
      - run: npm run prepare:windows
      - run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged desktop
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-unpacked/StudyDesk.exe'
          node tools/smoke-desktop.mjs $exe
        env:
          STUDYDESK_SMOKE_REPORT: packaged-smoke.json
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
            packaged-smoke.json
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag --verify-tag --title "StudyDesk $tag" --notes-file docs/release-notes.md dist/*.exe dist/*.zip dist/SHA256SUMS.txt
